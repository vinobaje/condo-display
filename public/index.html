        [data-theme="warm-luxury"]{--bg-primary:#1a1410;--bg-card:#241e17;--bg-card-hover:#2e2620;--text-primary:#f5efe6;--text-secondary:#a89880;--accent:#d4a553;--accent-glow:rgba(212,165,83,0.2);--urgent:#e85d4a;--urgent-glow:rgba(232,93,74,0.25);--important:#d4a553;--success:#7ab648;--border:rgba(212,165,83,0.08);--border-light:rgba(212,165,83,0.15);--header-bg:rgba(26,20,16,.9);--header-border:rgba(212,165,83,0.08);--ticker-bg:rgba(26,20,16,.92);--orb1:#d4a553;--orb2:#8b5e3c;--orb3:#c07040;--orb-opacity:.08;--font-heading:'Crimson Pro',serif;--font-body:'DM Sans',sans-serif}

        [data-theme="waterview-classic"]{--bg-primary:#0a2540;--bg-card:rgba(255,255,255,.06);--bg-card-hover:rgba(255,255,255,.1);--text-primary:#ffffff;--text-secondary:#b0c4de;--accent:#2196F3;--accent-glow:rgba(33,150,243,0.25);--urgent:#ef4444;--urgent-glow:rgba(239,68,68,0.3);--important:#ffc107;--success:#4caf50;--border:rgba(255,255,255,0.1);--border-light:rgba(255,255,255,0.15);--header-bg:rgba(10,37,64,.95);--header-border:rgba(255,255,255,0.08);--ticker-bg:#0d1f3c;--orb1:#1565c0;--orb2:#0277bd;--orb3:#00838f;--orb-opacity:.15;--font-heading:'DM Sans',sans-serif;--font-body:'DM Sans',sans-serif}

        /* Waterview Classic — hide top header, show combined bottom bar */
        [data-theme="waterview-classic"] .header{display:none}
        [data-theme="waterview-classic"] .ambient-bg{background:linear-gradient(135deg,#0a3d6b 0%,#0d5a8e 30%,#0e7490 60%,#0891b2 100%)}
        [data-theme="waterview-classic"] .orb{display:none}
        [data-theme="waterview-classic"] .widget-grid{padding:calc(12px*var(--u))}
        [data-theme="waterview-classic"] .widget{border-radius:calc(8px*var(--u))}
        [data-theme="waterview-classic"] .w-notices{border:none;border-radius:calc(8px*var(--u))}
        [data-theme="waterview-classic"] .w-notices .slide-area{border-radius:calc(8px*var(--u))}
        [data-theme="waterview-classic"] .news-ticker{height:clamp(calc(48px*var(--u)),7vh,calc(72px*var(--u)));background:#0d1f3c;border-top:none}

        /* Waterview Classic — weather widget blue gradient + hourly */
        [data-theme="waterview-classic"] .w-weather{background:linear-gradient(180deg,#1565c0 0%,#1976d2 40%,#2196f3 100%);border:none;padding:0;overflow:hidden}

        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:var(--font-body);background:var(--bg-primary);color:var(--text-primary);overflow:hidden;height:100vh;height:100dvh;width:100vw;margin:0;cursor:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
        .ambient-bg{position:fixed;inset:0;z-index:0;overflow:hidden}
        .orb{position:absolute;border-radius:50%;filter:blur(calc(120px*var(--u)));opacity:var(--orb-opacity);animation:orb-float 25s ease-in-out infinite}
        .orb-1{width:calc(600px*var(--u));height:calc(600px*var(--u));background:var(--orb1);top:-10%;left:-5%}
        .orb-2{width:calc(500px*var(--u));height:calc(500px*var(--u));background:var(--orb2);bottom:-10%;right:-5%;animation-delay:-8s}
        .orb-3{width:calc(400px*var(--u));height:calc(400px*var(--u));background:var(--orb3);top:40%;left:40%;animation-delay:-16s}
        @keyframes orb-float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(calc(30px*var(--u)),calc(-40px*var(--u))) scale(1.05)}66%{transform:translate(calc(-20px*var(--u)),calc(30px*var(--u))) scale(.95)}}

        .header{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:clamp(calc(12px*var(--u)),2vh,calc(28px*var(--u))) clamp(calc(20px*var(--u)),3vw,calc(48px*var(--u)));background:var(--header-bg);backdrop-filter:blur(calc(24px*var(--u)));border-bottom:calc(1px*var(--u)) solid var(--header-border);flex-shrink:0}
        .header-left{display:flex;align-items:center;gap:clamp(calc(12px*var(--u)),1.5vw,calc(24px*var(--u)));flex:1;min-width:0;overflow:hidden}
        .header-logo{width:clamp(calc(72px*var(--u)),13vh,calc(140px*var(--u)));height:auto;max-height:clamp(calc(72px*var(--u)),13vh,calc(140px*var(--u)));border-radius:0;object-fit:contain;background:none}
        .header-logo-placeholder{width:clamp(calc(72px*var(--u)),13vh,calc(140px*var(--u)));height:clamp(calc(72px*var(--u)),13vh,calc(140px*var(--u)));border-radius:calc(14px*var(--u));background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent),#8b5cf6));display:flex;align-items:center;justify-content:center;font-size:clamp(calc(28px*var(--u)),5.5vh,calc(52px*var(--u)));font-weight:700;color:#fff}
        .building-name{font-family:var(--font-heading);font-size:clamp(calc(24px*var(--u)),4.5vh,calc(48px*var(--u)));font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .building-subtitle{font-size:clamp(calc(13px*var(--u)),1.8vh,calc(20px*var(--u)));color:var(--text-secondary);margin-top:calc(2px*var(--u))}
        .header-center{display:flex;align-items:center;gap:clamp(calc(12px*var(--u)),2vw,calc(28px*var(--u)));flex-shrink:1;min-width:0}
        .weather-widget{display:flex;align-items:center;gap:clamp(calc(8px*var(--u)),1.2vw,calc(20px*var(--u)));padding:clamp(calc(6px*var(--u)),1vh,calc(14px*var(--u))) clamp(calc(10px*var(--u)),1.5vw,calc(28px*var(--u)));background:transparent;border:none;border-radius:calc(14px*var(--u));overflow:hidden;min-width:0}
        .weather-icon{font-size:clamp(calc(28px*var(--u)),5vh,calc(56px*var(--u)));line-height:1}
        .weather-temp{font-size:clamp(calc(32px*var(--u)),6vh,calc(60px*var(--u)));font-weight:800;font-variant-numeric:tabular-nums}
        .weather-details{font-size:clamp(calc(13px*var(--u)),1.8vh,calc(20px*var(--u)));color:var(--text-secondary);line-height:1.4;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .weather-label{font-size:clamp(calc(10px*var(--u)),1.2vh,calc(14px*var(--u)));color:var(--text-secondary);opacity:.6;text-transform:uppercase;letter-spacing:calc(.5px*var(--u));font-weight:600}
        .forecast-mini{display:flex;gap:clamp(calc(8px*var(--u)),1vw,calc(16px*var(--u)))}
        .forecast-day{text-align:center;padding:clamp(calc(4px*var(--u)),.8vh,calc(10px*var(--u))) clamp(calc(8px*var(--u)),1vw,calc(14px*var(--u)));background:rgba(255,255,255,.03);border-radius:calc(8px*var(--u));font-size:clamp(calc(10px*var(--u)),1.3vh,calc(14px*var(--u)));color:var(--text-secondary);font-weight:500}
        .forecast-day-icon{font-size:clamp(calc(16px*var(--u)),2.5vh,calc(26px*var(--u)));margin:clamp(calc(2px*var(--u)),.4vh,calc(6px*var(--u))) 0}
        .forecast-day-temp{font-size:clamp(calc(10px*var(--u)),1.3vh,calc(15px*var(--u)));font-weight:700;color:var(--text-primary)}
        .header-right{display:flex;align-items:center;gap:calc(24px*var(--u));flex-shrink:0}
        .datetime-block{text-align:right}
        .clock{font-size:clamp(calc(32px*var(--u)),6vh,calc(60px*var(--u)));font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:calc(-1px*var(--u))}
        .date-display{font-size:clamp(calc(13px*var(--u)),1.8vh,calc(20px*var(--u)));color:var(--text-secondary);margin-top:calc(2px*var(--u));font-weight:500}

        /* Widget Grid */
        .widget-grid{position:relative;z-index:5;flex:1;min-height:0;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(8,1fr);padding:clamp(calc(8px*var(--u)),1.2vmin,calc(20px*var(--u))) clamp(calc(12px*var(--u)),2vmin,calc(28px*var(--u)));gap:clamp(calc(6px*var(--u)),1vmin,calc(14px*var(--u)));overflow:hidden}
        .widget{position:relative;overflow:hidden;border-radius:clamp(calc(10px*var(--u)),1.2vmin,calc(18px*var(--u)));min-width:0;min-height:0}

        /* Notice Slideshow */
        .w-notices{background:var(--bg-card);border:calc(1px*var(--u)) solid var(--border)}
        .w-notices .slide-area{position:absolute;inset:0;overflow:hidden;border-radius:clamp(calc(10px*var(--u)),1.2vmin,calc(18px*var(--u)))}
        .slide{position:absolute;inset:0;opacity:0;transform:scale(.97);transition:opacity var(--transition-speed) ease,transform var(--transition-speed) ease;pointer-events:none}
        .slide.active{opacity:1;transform:scale(1);pointer-events:auto}
        .slide-qr{position:absolute;bottom:calc(24px*var(--u));right:calc(24px*var(--u));background:#fff;border-radius:calc(12px*var(--u));padding:calc(10px*var(--u)) calc(10px*var(--u)) calc(6px*var(--u));box-shadow:0 calc(8px*var(--u)) calc(24px*var(--u)) rgba(0,0,0,.35);text-align:center;z-index:5}
        .slide-qr img{display:block;width:calc(130px*var(--u));height:calc(130px*var(--u))}
        .slide-qr-label{font-size:calc(12px*var(--u));font-weight:700;color:#1a1a2e;margin-top:calc(4px*var(--u));letter-spacing:calc(.3px*var(--u))}
        .notice-card{height:100%;display:flex;flex-direction:column;overflow:hidden}
        .notice-card.has-media-side{flex-direction:row}
        .notice-card.media-only{position:relative}
        .media-fullscreen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
        .media-fullscreen:has(.pdf-embed){background:#fff}
        .media-fullscreen img,.media-fullscreen video,.media-fullscreen iframe{width:100%;height:100%;object-fit:contain}
        .media-fullscreen iframe.pdf-embed{background:#fff}
        .media-overlay-text{position:absolute;bottom:0;left:0;right:0;padding:clamp(calc(16px*var(--u)),3vh,calc(40px*var(--u))) clamp(calc(20px*var(--u)),3vw,calc(48px*var(--u)));background:linear-gradient(transparent,rgba(0,0,0,.85))}
        .media-overlay-text .notice-title{font-size:clamp(calc(20px*var(--u)),4vh,calc(42px*var(--u)));text-shadow:0 calc(2px*var(--u)) calc(8px*var(--u)) rgba(0,0,0,.5)}
        .media-side{flex:0 0 48%;position:relative;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center}
        .media-side img,.media-side video,.media-side iframe{width:100%;height:100%;object-fit:contain}
        .media-side iframe.pdf-embed{background:#fff}
        .pdf-embed{width:100%;height:100%;border:none;background:#fff}
        .notice-content{flex:1;padding:clamp(calc(20px*var(--u)),4vh,calc(56px*var(--u))) clamp(calc(20px*var(--u)),3vw,calc(56px*var(--u)));display:flex;flex-direction:column;justify-content:center;overflow:hidden}
        .notice-category{display:inline-flex;align-items:center;gap:clamp(calc(4px*var(--u)),.6vmin,calc(8px*var(--u)));font-size:clamp(calc(9px*var(--u)),1.3vh,calc(14px*var(--u)));font-weight:600;text-transform:uppercase;letter-spacing:calc(1.5px*var(--u));color:var(--accent);margin-bottom:clamp(calc(8px*var(--u)),2vh,calc(20px*var(--u)))}
        .notice-category .dot{width:clamp(calc(5px*var(--u)),.8vh,calc(9px*var(--u)));height:clamp(calc(5px*var(--u)),.8vh,calc(9px*var(--u)));border-radius:50%;background:var(--accent)}
        .priority-urgent .notice-category{color:var(--urgent)}
        .priority-urgent .notice-category .dot{background:var(--urgent);box-shadow:0 0 calc(10px*var(--u)) var(--urgent-glow)}
        .priority-important .notice-category{color:var(--important)}
        .priority-important .notice-category .dot{background:var(--important)}
        .notice-title{font-family:var(--font-heading);font-size:clamp(calc(22px*var(--u)),4.5vh,calc(52px*var(--u)));font-weight:700;line-height:1.15;margin-bottom:clamp(calc(10px*var(--u)),2.5vh,calc(24px*var(--u)));letter-spacing:calc(-.5px*var(--u))}
        .notice-body{font-size:clamp(calc(14px*var(--u)),2.5vh,calc(28px*var(--u)));line-height:1.65;color:var(--text-secondary);overflow:hidden}
        .notice-meta{margin-top:auto;padding-top:clamp(calc(10px*var(--u)),2vh,calc(24px*var(--u)));border-top:calc(1px*var(--u)) solid var(--border);display:flex;gap:clamp(calc(8px*var(--u)),1vw,calc(16px*var(--u)));font-size:clamp(calc(10px*var(--u)),1.3vh,calc(14px*var(--u)));color:var(--text-secondary)}
        .progress-bar{position:absolute;bottom:0;left:0;height:calc(3px*var(--u));background:linear-gradient(90deg,var(--accent),#8b5cf6);border-radius:calc(2px*var(--u));z-index:20;transition:width linear}

        /* Notice List */
        .w-notice-list{background:var(--bg-card);border:calc(1px*var(--u)) solid var(--border);display:flex;flex-direction:column;padding:clamp(calc(8px*var(--u)),1.2vmin,calc(16px*var(--u)))}
        .w-notice-list .wt{font-size:clamp(calc(9px*var(--u)),1.1vh,calc(13px*var(--u)));font-weight:600;text-transform:uppercase;letter-spacing:calc(1.5px*var(--u));color:var(--text-secondary);margin-bottom:clamp(calc(6px*var(--u)),1vh,calc(12px*var(--u)));padding:0 calc(4px*var(--u))}
        .w-notice-list .list{flex:1;display:flex;flex-direction:column;gap:clamp(calc(4px*var(--u)),.7vmin,calc(10px*var(--u)));overflow:hidden}

        // ?device=Name (or ?tv=Name) URL param and is remembered afterwards.
        // Guarded so a transiently stale cached app.js can never break the display.
        function sendHeartbeat() {
            try {
                if (typeof writeHeartbeat !== 'function') return;
                // Skip when embedded as a preview (admin/notice editor) so it
                // doesn't register as a phantom TV in the health monitor.
                if (window.self !== window.top) return;
                const deviceId = getDisplayDeviceId();
                const params = new URLSearchParams(location.search);
                let name = (params.get('device') || params.get('tv') || '').trim();
                if (name) localStorage.setItem('tv_device_name', name.slice(0, 60));
                name = name || localStorage.getItem('tv_device_name') || '';
                const dev = `${screen.width}×${screen.height} · ${navigator.userAgent.slice(0, 120)}`;
                Promise.resolve(writeHeartbeat(deviceId, name, dev)).catch(() => {});
            } catch (e) { /* never let the heartbeat break the display */ }
        }
        sendHeartbeat();
        setInterval(sendHeartbeat, 2 * 60 * 1000); // every 2 minutes
        // Extra beats so a TV shows online promptly after waking / reconnecting
        document.addEventListener('visibilitychange', () => { if (!document.hidden) sendHeartbeat(); });
        window.addEventListener('online', sendHeartbeat);

        // ═══ Remote commands from admin (reload) ═══
        // Admin writes a command to this TV's command doc; we reload when a NEW
        // one arrives. The first snapshot is recorded without acting, so an old
        // command can never cause a reload loop on boot.
        (function listenForCommands() {
            if (window.self !== window.top || typeof onDisplayCommand !== 'function') return;
            try {
                const deviceId = getDisplayDeviceId();
                let lastCmdTs = null;
                onDisplayCommand(deviceId, (cmd) => {
                    if (!cmd || !cmd.ts) return;
                    if (lastCmdTs === null) { lastCmdTs = cmd.ts; return; } // ignore pre-existing on load
                    if (cmd.ts > lastCmdTs) {
                        lastCmdTs = cmd.ts;
                        // Browser can only reload the page (not OS-reboot); this
                        // restarts the display app and pulls the latest code.
                        if (cmd.action === 'reload' || cmd.action === 'reboot') location.reload();
                    }
                });
            } catch (e) { /* never let command listener break the display */ }
        })();

        // ═══ Self-update: reload every 6 hours ═══
        // Kiosk Pis load the page once at boot and run for weeks, so they never
        // pick up new code (or re-establish a fresh connection) on their own.
        // A periodic reload keeps every TV current without a manual reboot.
        // Only reloads when the server is actually reachable — otherwise the TV
        // could end up on a browser error page; retries every 30 min instead.
        if (window.self === window.top) {
            const tryReload = async () => {
                try {
                    const r = await fetch('/index.html', { method: 'HEAD', cache: 'no-store' });
                    if (r.ok) { location.reload(); return; }
                } catch (e) { /* offline — keep showing the current board */ }
                setTimeout(tryReload, 30 * 60 * 1000);
            };
            setTimeout(tryReload, 6 * 60 * 60 * 1000);
        }

        let settings = {}, notices = [], currentIndex = 0, slideTimer = null, currentVideoEl = null;
        let newsItems = [], feedGroups = [], newsTimers = [];
        let lastCacheVersion = null;

        const DEFAULT_LAYOUT = [
            { id:'notices', x:0, y:0, w:8, h:8 },
            { id:'notice_list', x:8, y:0, w:4, h:3 },
            { id:'news_0', x:8, y:3, w:4, h:3 },
            { id:'emergency_contacts', x:8, y:6, w:4, h:2 },
        ];

        function updateClock() {
            const now = new Date();
            document.getElementById('clockDisplay').textContent = now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
            document.getElementById('dateDisplay').textContent = now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
            document.querySelectorAll('.w-clock').forEach(el => {
                el.querySelector('.wc-time').textContent = now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
                el.querySelector('.wc-date').textContent = now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
            });
            // Bottom bar clock (Waterview Classic)
            const bbc = document.getElementById('bottomBarClock');
            if (bbc) bbc.textContent = now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',second:'2-digit',hour12:false});
        }
        setInterval(updateClock, 1000);
        updateClock();

        function buildWidgetGrid(layout) {
            const grid = document.getElementById('widgetGrid');
            grid.innerHTML = '';
            layout.forEach(w => {
                const el = document.createElement('div');
                el.className = 'widget';
                el.style.gridColumn = `${w.x+1} / ${w.x+w.w+1}`;
                el.style.gridRow = `${w.y+1} / ${w.y+w.h+1}`;
                el.id = `widget-${w.id}`;
                if (w.id === 'notices') {
                    el.classList.add('w-notices');
                    el.innerHTML = '<div class="slide-area" id="slideArea"><div class="progress-bar" id="progressBar"></div></div>';
                } else if (w.id === 'notice_list') {
                    el.classList.add('w-notice-list');
                    el.innerHTML = '<div class="wt">📋 All Notices</div><div class="list" id="sidebarList"></div>';
                } else if (w.id.startsWith('news_')) {
                    el.classList.add('w-news');
                    el.innerHTML = `<div class="wt" id="newsTitle-${w.id}">📰 News</div><div class="carousel" id="newsCarousel-${w.id}"></div><div class="news-dots" id="newsDots-${w.id}"></div>`;
                } else if (w.id === 'emergency_contacts') {
                    el.classList.add('w-contacts');
                    el.innerHTML = '<div class="ec-header"><span class="ec-icon">🚨</span><span class="ec-title">Contacts</span></div><div class="ec-list" id="contactsList"></div>';
                } else if (w.id === 'weather') {
                    el.classList.add('w-weather');
                    el.innerHTML = '<div class="wloc" id="wWeatherLoc"></div><div class="weather-top"><div class="wi" id="wWeatherIcon">🌡️</div><div><div class="wtemp" id="wWeatherTemp">--°</div><div class="wdesc" id="wWeatherDesc">Loading...</div></div></div><div class="wfc" id="wWeatherForecast"></div><div class="wfc-hourly" id="wWeatherHourly"></div>';
                } else if (w.id === 'clock') {
                    el.classList.add('w-clock');
                    el.innerHTML = '<div class="wc-time"></div><div class="wc-date"></div>';
                }
                grid.appendChild(el);
            });
            updateClock();
        }

        onSettingsChange(async (s) => {
            settings = s;

            // Check if admin triggered a cache clear
            const cv = s.cache_version || 0;
            if (lastCacheVersion !== null && cv !== lastCacheVersion) {
                console.log('Cache clear triggered by admin');
                if (navigator.serviceWorker && navigator.serviceWorker.controller) {
                    navigator.serviceWorker.controller.postMessage('clear-cache');
                }
                setTimeout(() => location.reload(), 2000);
            }
            lastCacheVersion = cv;

            document.documentElement.setAttribute('data-theme', s.display_theme || 'dark-modern');
            document.getElementById('buildingName').textContent = s.building_name;
            document.getElementById('managementCompany').textContent = s.management_company;
            const logo = document.getElementById('logoContainer');
            if (s.logo_url) { logo.outerHTML = `<img src="${s.logo_url}" class="header-logo" id="logoContainer" alt="">`; }
            else if (logo.tagName === 'IMG') { logo.outerHTML = `<div class="header-logo-placeholder" id="logoContainer">${s.building_name[0]}</div>`; }
            else { logo.textContent = s.building_name[0]; }
            // Apply logo background to match page
            const logoEl2 = document.getElementById('logoContainer');
            if (logoEl2 && logoEl2.tagName === 'IMG') {
                logoEl2.style.background = 'none';
            }
            const logoScale = (parseInt(s.logo_size) || 100) / 100;
            const logoEl = document.getElementById('logoContainer');
            if (logoEl && logoScale !== 1) {
                logoEl.style.width = `clamp(calc(72px*var(--u)),${(13 * logoScale).toFixed(1)}vh,calc(${Math.round(140 * logoScale)}px*var(--u)))`;
                logoEl.style.height = logoEl.tagName === 'IMG' ? 'auto' : logoEl.style.width;
                logoEl.style.maxHeight = `clamp(72px,${(13 * logoScale).toFixed(1)}vh,${Math.round(140 * logoScale)}px)`;
            }
            document.documentElement.style.setProperty('--transition-speed', s.transition_speed + 's');

            // Widget font size scaling via CSS custom properties (no zoom - prevents overflow)
            // Remove old dynamic style if exists
            const oldStyle = document.getElementById('fs-overrides');
            if (oldStyle) oldStyle.remove();

            // Display zoom
            // Each TV can have its own size (set per TV in Admin → TV Displays); otherwise the global Display Zoom.
            // Previews embedded in the admin always use the global value.
            const myTvId = window.self === window.top ? getDisplayDeviceId() : null;
            const tvZoom = parseFloat(myTvId && s.display_overrides?.[myTvId]?.zoom);
            const globalS = (tvZoom > 0 ? tvZoom : parseFloat(s.display_zoom)) || 1;

            let css = '';
            const wrapper = document.getElementById('displayRoot');
            if (wrapper && globalS !== 1) {
                wrapper.style.transform = `scale(${globalS})`;
                wrapper.style.transformOrigin = 'top left';
                wrapper.style.width = `${100 / globalS}vw`;
                wrapper.style.height = `${100 / globalS}vh`;
            } else if (wrapper) {
                // Back to 100%: undo any earlier zoom without needing a reload
                wrapper.style.transform = '';
                wrapper.style.width = '100vw';
                wrapper.style.height = '100dvh';
            }

            // Simple pixel-based font overrides — what you set is what you get
            const hdrPx = parseInt(s.fs_header_px) || 0;
            const noticePx = parseInt(s.fs_notice_px) || 0;
            const newsPx = parseInt(s.fs_news_px) || 0;
            const contactsPx = parseInt(s.fs_contacts_px) || 0;
            const tickerPx = parseInt(s.fs_ticker_px) || 0;

            if (hdrPx) {
                const r = (base, px) => Math.round(base * px / 48); // scale proportionally to building name
                css += `.building-name { font-size: ${hdrPx}px !important; }
                .building-subtitle { font-size: ${r(20, hdrPx)}px !important; }
                .clock { font-size: ${r(60, hdrPx)}px !important; }
                .date-display { font-size: ${r(20, hdrPx)}px !important; }
                .weather-temp { font-size: ${r(60, hdrPx)}px !important; }
                .weather-icon { font-size: ${r(50, hdrPx)}px !important; }
                .weather-details { font-size: ${r(18, hdrPx)}px !important; }
                .weather-label { font-size: ${r(14, hdrPx)}px !important; }\n`;
            }
            if (noticePx) {
                const r = (base, px) => Math.round(base * px / 28);
                css += `.notice-title { font-size: ${r(48, noticePx)}px !important; }
                .notice-body { font-size: ${noticePx}px !important; }
                .notice-category { font-size: ${r(14, noticePx)}px !important; }
                .notice-meta { font-size: ${r(14, noticePx)}px !important; }\n`;
            }
            if (newsPx) {
                const r = (base, px) => Math.round(base * px / 22);
                css += `.w-news .news-card-title { font-size: ${newsPx}px !important; }
                .w-news .news-card-desc { font-size: ${r(16, newsPx)}px !important; }
                .w-news .news-card-source { font-size: ${r(12, newsPx)}px !important; }
                .w-news .news-card-time { font-size: ${r(12, newsPx)}px !important; }
                .w-news .sec-title { font-size: ${newsPx}px !important; }
                .w-news .sec-desc { font-size: ${r(14, newsPx)}px !important; }\n`;
            }
            if (contactsPx) {
                css += `.w-contacts .ec-label { font-size: ${contactsPx}px !important; }
                .w-contacts .ec-number { font-size: ${Math.round(contactsPx * 1.1)}px !important; }
                .w-contacts .ec-title { font-size: ${Math.round(contactsPx * 0.8)}px !important; }\n`;
            }
            if (tickerPx) {
                css += `.news-ticker .news-item { font-size: ${tickerPx}px !important; }
                .news-ticker .news-item-source { font-size: ${Math.round(tickerPx * 0.6)}px !important; }
                .news-ticker-label { font-size: ${Math.round(tickerPx * 0.75)}px !important; }
                .bottom-bar-name { font-size: ${tickerPx}px !important; }
                .bottom-bar-clock { font-size: ${Math.round(tickerPx * 1.5)}px !important; }\n`;
            }

            if (css) {
                css = css.replace(/(\d*\.?\d+)px/g, 'calc($1px*var(--u))'); // same resolution scaling as the stylesheet
                const styleEl = document.createElement('style');
                styleEl.id = 'fs-overrides';
                styleEl.textContent = css;
                document.head.appendChild(styleEl);
            }

            // Bottom bar brand (Waterview Classic)
            document.getElementById('bottomBarName').textContent = s.building_name || '';
            const bbLogo = document.getElementById('bottomBarLogo');
            if (s.logo_url) { bbLogo.outerHTML = `<img src="${s.logo_url}" class="bottom-bar-logo" id="bottomBarLogo" alt="">`; }
            else if (bbLogo.tagName === 'IMG') { bbLogo.outerHTML = `<div class="bottom-bar-logo-placeholder" id="bottomBarLogo">${(s.building_name||'W')[0]}</div>`; }
            else { bbLogo.textContent = (s.building_name||'W')[0]; }

            const overlay = document.getElementById('emergencyOverlay');
            if (s.emergency_mode) { overlay.classList.add('active'); document.getElementById('emergencyText').textContent = s.emergency_message || 'Please follow building emergency procedures.'; }
            else { overlay.classList.remove('active'); }

            const layout = (Array.isArray(s.layout) && s.layout.length > 0) ? s.layout : DEFAULT_LAYOUT;
            buildWidgetGrid(layout);

            // Apply widget font scaling AFTER widgets are built
            // Widget font scaling applied via CSS overrides above

            const contactsList = document.getElementById('contactsList');
            if (contactsList) {
                const contacts = s.emergency_contacts || [];
                contactsList.innerHTML = contacts.map(c => `<div class="ec-item"><span class="ec-label">${escapeHtml(c.label)}</span><span class="ec-number">${escapeHtml(c.number)}</span></div>`).join('');
            }

            if (s.show_weather) loadWeather();
            if (s.show_news !== false) loadNews();

            // Ticker
            const tickerEl = document.getElementById('newsTicker');
            const tickerLabel = document.getElementById('newsTickerLabel');
            const isWaterview = (s.display_theme === 'waterview-classic');
            const showTicker = isWaterview || (s.show_ticker !== false);
            const tickerMode = s.ticker_mode || 'news';
            tickerEl.classList.toggle('hidden', !showTicker);

            if (showTicker && tickerMode === 'custom') {
                const messages = s.ticker_messages || (s.ticker_custom_text ? [s.ticker_custom_text] : []);
                if (messages.length > 0) {
                    tickerLabel.innerHTML = '<div class="pulse-dot"></div>INFO';
                    const ticker = document.getElementById('newsTickerContent');
                    let single = messages.map(m => `<span class="news-item">${escapeHtml(m)}<span class="news-item-dot">◆</span></span>`).join('');
                    // Repeat enough times to guarantee filling 2x screen width
                    let half = '';
                    for (let r = 0; r < 20; r++) half += single;
                    ticker.innerHTML = half + half;
                    requestAnimationFrame(() => { ticker.style.animationDuration = (ticker.scrollWidth / 2 / 60) + 's'; });
                }
            } else {
                tickerLabel.innerHTML = '<div class="pulse-dot"></div>NEWS';
            }

            renderNotices();
            startRotation();
        });

        let allNoticesRaw = [];
        onNoticesChange((allNotices) => {
            allNoticesRaw = allNotices;
            filterAndRender();
        });

        function filterAndRender() {
            const today = new Date().toLocaleDateString('en-CA'); // local YYYY-MM-DD, so notices last until local midnight
            notices = allNoticesRaw.filter(n => {
                if (!n.active) return false;
                if (n.start_date && n.start_date > today) return false;
                if (n.end_date && n.end_date < today) return false;
                return true;
            }).sort((a, b) => (b.priority || 0) - (a.priority || 0));
            renderNotices();
            startRotation();
        }

        // Re-check expiry every 5 minutes
        setInterval(filterAndRender, 5 * 60 * 1000);

        async function loadWeather() {
            try {
                const data = await fetchWeather(settings);
                if (data.error) return;
                const c = data.current, code = c.weather_code, units = settings.weather_units || 'metric';
                document.getElementById('weatherIcon').textContent = WMO_ICONS[code] || '🌡️';
                document.getElementById('weatherTemp').textContent = Math.round(c.temperature_2m);
                document.getElementById('weatherDetails').innerHTML = `${WMO_DESC[code] || 'N/A'}<br>Humidity ${c.relative_humidity_2m}% · Wind ${Math.round(c.wind_speed_10m)} ${units === 'metric' ? 'km/h' : 'mph'}`;
                document.getElementById('weatherLocation').textContent = data.location_name || '';
                if (data.daily) {
                    const fg = document.getElementById('forecastMini'); fg.innerHTML = '';
                    for (let i=1;i<Math.min(data.daily.time.length,4);i++) { const d=new Date(data.daily.time[i]); fg.innerHTML += `<div class="forecast-day"><div>${DAY_NAMES[d.getDay()]}</div><div class="forecast-day-icon">${WMO_ICONS[data.daily.weather_code[i]]||'🌡️'}</div><div class="forecast-day-temp">${Math.round(data.daily.temperature_2m_max[i])}° / ${Math.round(data.daily.temperature_2m_min[i])}°</div></div>`; }
                }
                document.getElementById('weatherWidget').style.display = 'flex';
                // Standalone weather widget
                const ww = document.getElementById('wWeatherIcon');
                if (ww) {
                    ww.textContent = WMO_ICONS[code] || '🌡️';
                    document.getElementById('wWeatherTemp').textContent = Math.round(c.temperature_2m) + '°';
                    document.getElementById('wWeatherDesc').textContent = WMO_DESC[code] || '';
                    document.getElementById('wWeatherLoc').textContent = data.location_name || '';
                    // Daily forecast
                    if (data.daily) {
                        const fc = document.getElementById('wWeatherForecast'); fc.innerHTML = '';
                        for (let i=1;i<Math.min(data.daily.time.length,4);i++) { const d=new Date(data.daily.time[i]); fc.innerHTML += `<div class="wfc-d"><div class="fn">${DAY_NAMES[d.getDay()]}</div><div class="fi">${WMO_ICONS[data.daily.weather_code[i]]||'🌡️'}</div><div class="ft">${Math.round(data.daily.temperature_2m_max[i])}°/${Math.round(data.daily.temperature_2m_min[i])}°</div></div>`; }
                    }
                    // Hourly forecast (for Waterview Classic)
                    const hourlyEl = document.getElementById('wWeatherHourly');
                    if (hourlyEl && data.hourly) {
                        hourlyEl.innerHTML = '';
                        const now = new Date();
                        const currentHour = now.getHours();
                        let startIdx = data.hourly.time.findIndex(t => new Date(t).getHours() >= currentHour && new Date(t).getDate() === now.getDate());
                        if (startIdx < 0) startIdx = 0;
                        for (let i = startIdx; i < Math.min(startIdx + 6, data.hourly.time.length); i++) {
                            const t = new Date(data.hourly.time[i]);
                            const h = t.getHours();
                            const ampm = h >= 12 ? 'PM' : 'AM';
                            const h12 = h === 0 ? 12 : h > 12 ? h - 12 : h;
                            const hCode = data.hourly.weather_code[i];
                            hourlyEl.innerHTML += `<div class="wfc-h"><div class="ht">${String(h12).padStart(2,'0')}:00 ${ampm}</div><div class="hi">${WMO_ICONS[hCode]||'🌡️'}</div><div class="htemp">${Math.round(data.hourly.temperature_2m[i])}°</div><div class="hdesc">${WMO_DESC[hCode]||''}</div></div>`;
                        }
                    }
                }
            } catch (e) { console.error('Weather error:', e); }
        }
        setInterval(() => { if (settings.show_weather) loadWeather(); }, 600000);

        async function loadNews() {
            try {
                newsItems = await fetchNews(settings);
                feedGroups = await fetchNewsByFeed(settings);
                const smartNews = settings.smart_news !== false; // on by default
                const tickerMode = settings.ticker_mode || 'news';

                // Smart: sort ticker items by priority (breaking first)
                const tickerItems = smartNews ? sortNewsByPriority(newsItems) : newsItems;

                if (tickerMode === 'news' && tickerItems.length > 0) {
                    const ticker = document.getElementById('newsTickerContent');
                    let html = '';
                    for (let r=0;r<10;r++) { tickerItems.forEach(item => {
                        const badge = smartNews ? detectNewsBadge(item.title, item.description) : null;
                        const title = smartNews ? cleanHeadline(item.title, item.source) : item.title;
                        const cls = badge?.type === 'breaking' ? ' ticker-breaking' : '';
                        html += `<span class="news-item${cls}"><span class="news-item-source">${escapeHtml(item.source)}</span>${badge ? `<span class="news-badge ${badge.type}">${badge.label}</span> ` : ''}${escapeHtml(title)}<span class="news-item-dot">◆</span></span>`;
                    }); }
                    ticker.innerHTML = html + html;
                    requestAnimationFrame(() => { ticker.style.animationDuration = (ticker.scrollWidth / 2 / 80) + 's'; });
                }
                newsTimers.forEach(t => clearInterval(t));
                newsTimers = [];
                feedGroups.forEach((group, gi) => {
                    const carousel = document.getElementById(`newsCarousel-news_${gi}`);
                    const dotsEl = document.getElementById(`newsDots-news_${gi}`);
                    const titleEl = document.getElementById(`newsTitle-news_${gi}`);
                    if (!carousel) return;
                    if (titleEl) titleEl.textContent = `📰 ${group.name}`;

                    // Smart: sort cards by priority
                    const items = smartNews ? sortNewsByPriority(group.items) : group.items;

                    // Collect articles from OTHER feeds for secondary slot
                    let otherItems = [];
                    feedGroups.forEach((og, ogi) => {
                        if (ogi !== gi) {
                            const sorted = smartNews ? sortNewsByPriority(og.items) : og.items;
                            sorted.forEach(item => otherItems.push(item));
                        }
                    });

                    let ch = '', dh = '';
                    let cardIdx = 0;
                    for (let i = 0; i < items.length; i++) {
                        const primary = items[i];
                        // Secondary comes from other feeds, cycling through
                        const secondary = otherItems.length > 0 ? otherItems[i % otherItems.length] : null;
                        const badge = smartNews ? detectNewsBadge(primary.title, primary.description) : null;
                        const title = smartNews ? cleanHeadline(primary.title, primary.source) : primary.title;
                        const isBreaking = badge?.type === 'breaking';
                        const img = primary.image ? `<img src="${primary.image}" class="news-card-img" alt="" onerror="this.style.width='0';this.style.flex='0'">` : '';
                        const badgeHtml = badge ? `<span class="news-badge ${badge.type}">${badge.label}</span>` : '';
                        const qrHtml = primary.link ? `<div class="news-card-qr"><img src="${generateQRUrl(primary.link, 80)}" alt="QR"><div class="news-card-qr-label">Scan</div></div>` : '';

                        let secHtml = '';
                        if (secondary) {
                            const secBadge = smartNews ? detectNewsBadge(secondary.title, secondary.description) : null;
                            const secTitle = smartNews ? cleanHeadline(secondary.title, secondary.source) : secondary.title;
                            const secBadgeHtml = secBadge ? `<span class="news-badge ${secBadge.type}">${secBadge.label}</span>` : '';
                            const secQr = secondary.link ? `<div class="sec-qr"><img src="${generateQRUrl(secondary.link, 60)}" alt="QR"></div>` : '';
                            const secImg = secondary.image ? `<img src="${secondary.image}" class="sec-img" alt="" onerror="this.style.display='none'">` : '';
                            secHtml = `<div class="news-card-secondary">${secImg}<div class="sec-body"><div class="sec-source">${escapeHtml(secondary.source)}${secBadgeHtml}</div><div class="sec-title">${escapeHtml(secTitle)}</div><div class="sec-desc">${escapeHtml(secondary.description||'')}</div><div class="sec-time">${formatTimeAgo(secondary.pub_date)}</div></div>${secQr}</div>`;
                        }

                        ch += `<div class="news-card nc-${gi} ${cardIdx===0?'active':''} ${isBreaking?'breaking-card':''}" data-idx="${cardIdx}"><div class="news-card-primary">${img}<div class="news-card-body"><div class="news-card-source"><span class="live-dot"></span>${escapeHtml(primary.source)}${badgeHtml}</div><div class="news-card-title">${escapeHtml(title)}</div><div class="news-card-desc">${escapeHtml(primary.description||'')}</div><div class="news-card-footer"><div class="news-card-time">${formatTimeAgo(primary.pub_date)}</div>${qrHtml}</div></div></div>${secHtml}</div>`;
                        dh += `<div class="news-dot nd-${gi} ${cardIdx===0?'active':''}"></div>`;
                        cardIdx++;
                    }
                    carousel.innerHTML = ch;
                    fitNewsSummaries();
                    if (dotsEl) dotsEl.innerHTML = dh;
                    if (cardIdx > 1) {
                        let idx = 0;
                        const baseInterval = 8000 + gi * 2000;
                        const timer = setInterval(() => {
                            const cards = document.querySelectorAll(`.nc-${gi}`), dots = document.querySelectorAll(`.nd-${gi}`);
                            cards.forEach(c => c.classList.remove('active')); dots.forEach(d => d.classList.remove('active'));
                            idx = (idx+1) % cards.length; cards[idx].classList.add('active'); dots[idx].classList.add('active');
                        }, baseInterval);
                        newsTimers.push(timer);
                    }
                });
            } catch (e) { console.error('News error:', e); }
        }
        setInterval(() => { if (settings.show_news) loadNews(); }, 600000);

        function getPriorityClass(p) { return p >= 2 ? 'priority-urgent' : p >= 1 ? 'priority-important' : ''; }
        function renderMedia(n) { const u=n.media_url||'';if(!u)return'';const ft=n.file_type||getFileType(u);if(ft==='video')return`<video src="${u}" muted autoplay loop playsinline></video>`;if(ft==='pdf')return`<iframe src="${u}#toolbar=0&navpanes=0&scrollbar=0&view=Fit" class="pdf-embed" frameborder="0"></iframe>`;return`<img src="${u}" alt="">`; }

        function buildSlide(notice, index) {
            const cat = CATEGORIES[notice.category] || CATEGORIES.general, pc = getPriorityClass(notice.priority), hasMedia = notice.media_url;
            const ft = notice.file_type || getFileType(notice.media_url || '');
            let mode = notice.display_mode || (hasMedia ? 'media_with_text' : 'text');
            if (ft === 'pdf') mode = 'media_only';
            let inner;
            if (mode === 'media_only' && hasMedia) { inner = `<div class="notice-card media-only ${pc}"><div class="media-fullscreen">${renderMedia(notice)}</div></div>`; }
            else if (hasMedia && mode !== 'text') { inner = `<div class="notice-card has-media-side ${pc}"><div class="media-side">${renderMedia(notice)}</div><div class="notice-content"><div class="notice-category"><span class="dot"></span>${cat.icon} ${cat.label}${notice.priority>=2?' — URGENT':notice.priority>=1?' — Important':''}</div><div class="notice-title">${escapeHtml(notice.title)}</div><div class="notice-body">${escapeHtml(notice.body||'').replace(/\n/g,'<br>')}</div><div class="notice-meta"><span>Posted ${formatDate(notice.created_at)}</span>${notice.end_date?`<span>· Expires ${formatDate(notice.end_date)}</span>`:''}</div></div></div>`; }
            else { inner = `<div class="notice-card ${pc}"><div class="notice-content"><div class="notice-category"><span class="dot"></span>${cat.icon} ${cat.label}${notice.priority>=2?' — URGENT':notice.priority>=1?' — Important':''}</div><div class="notice-title">${escapeHtml(notice.title)}</div><div class="notice-body">${escapeHtml(notice.body||'').replace(/\n/g,'<br>')}</div><div class="notice-meta"><span>Posted ${formatDate(notice.created_at)}</span>${notice.end_date?`<span>· Expires ${formatDate(notice.end_date)}</span>`:''}</div></div></div>`; }
            let qr = '';
            if (notice.show_qr && notice.id) {
                const viewUrl = `${location.origin}/view.html?id=${notice.id}`;
                qr = `<div class="slide-qr"><img src="${generateQRUrl(viewUrl, 130)}" alt="Scan for full notice"><div class="slide-qr-label">Scan for details</div></div>`;
            }
            return `<div class="slide ${index===0?'active':''}" data-index="${index}">${inner}${qr}</div>`;
        }

        function buildSidebarCard(notice, index) {
            const cat = CATEGORIES[notice.category] || CATEGORIES.general, ft = notice.file_type || getFileType(notice.media_url||'');
            let thumb = cat.icon;
            if (notice.media_url) { thumb = ft==='video'?`<video src="${notice.media_url}" muted></video>`:ft==='pdf'?'📄':`<img src="${notice.media_url}" alt="">`; }
            return `<div class="sidebar-card ${index===0?'current':''}" data-index="${index}"><div class="sidebar-card-thumb">${thumb}</div><div class="sidebar-card-info"><div class="sidebar-card-cat">${cat.icon} ${cat.label}</div><div class="sidebar-card-title">${escapeHtml(notice.title)}</div></div></div>`;
        }

        function renderNotices() {
            const area = document.getElementById('slideArea'), sidebar = document.getElementById('sidebarList');
            if (!area) return;
            const bar = document.getElementById('progressBar');
            if (notices.length === 0) { area.innerHTML = '<div class="no-notices"><div class="no-notices-icon">📭</div><div class="no-notices-text">No notices at this time</div></div>'; area.appendChild(bar); if (sidebar) sidebar.innerHTML = ''; return; }
            area.innerHTML = notices.map((n,i) => buildSlide(n,i)).join('');
            area.appendChild(bar);
            if (sidebar) sidebar.innerHTML = notices.map((n,i) => buildSidebarCard(n,i)).join('');
        }

        function showSlide(index) {
            const slides = document.querySelectorAll('.slide'), cards = document.querySelectorAll('.sidebar-card');
            if (!slides.length) return;
            if (currentVideoEl) { currentVideoEl.pause(); currentVideoEl = null; }
            if (slideTimer) { clearTimeout(slideTimer); slideTimer = null; }
            slides.forEach(s => s.classList.remove('active')); cards.forEach(c => c.classList.remove('current'));
            currentIndex = index % slides.length;
            slides[currentIndex].classList.add('active');
            if (cards[currentIndex]) cards[currentIndex].classList.add('current');
            const vid = slides[currentIndex].querySelector('video');
            if (vid) { vid.currentTime = 0; vid.play().catch(()=>{}); }
            const ft = notices[currentIndex]?.file_type, vsd = (settings.video_slide_duration||0)*1000;
            let duration;
            if (ft==='video'&&vsd===0&&vid) { vid.loop=false;currentVideoEl=vid;vid.addEventListener('ended',()=>{setTimeout(()=>showSlide(currentIndex+1),500)},{once:true});duration=120000; }
            else if (ft==='video'&&vsd>0) { if(vid)vid.loop=true;duration=vsd; }
            else { duration=(settings.slide_duration||12)*1000; }
            const bar = document.getElementById('progressBar');
            bar.style.transition='none';bar.style.width='0%';
            requestAnimationFrame(()=>{requestAnimationFrame(()=>{bar.style.transition=`width ${duration}ms linear`;bar.style.width='100%';});});
            slideTimer = setTimeout(() => showSlide(currentIndex+1), duration);
        }

        function startRotation() { if(slideTimer)clearTimeout(slideTimer);if(notices.length>0)showSlide(0); }
    </script>
    <script>
        // Register media cache service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').then(reg => {
                console.log('Media cache SW registered');
            }).catch(err => console.warn('SW registration failed:', err));
        }

        // TV auto-fit: scale page to fit viewport if content overflows
        // News summaries get whatever height is left in a card; show only whole lines so nothing is cut mid-line
        function fitNewsSummaries() {
            document.querySelectorAll('.news-card-desc, .sec-desc').forEach(el => {
                el.style.display = ''; el.style.webkitLineClamp = '';
                const lh = parseFloat(getComputedStyle(el).lineHeight) || 1;
                const lines = Math.min(3, Math.floor((el.clientHeight + 1) / lh));
                if (lines < 1 || !el.textContent.trim()) el.style.display = 'none';
                else el.style.webkitLineClamp = String(lines);
            });
        }
        window.addEventListener('resize', () => setTimeout(fitNewsSummaries, 50));
        document.fonts?.ready.then(() => fitNewsSummaries());

        function fitDisplay() {
            const b = document.body;
            b.style.transform = '';
            b.style.width = '100vw';
            // Check if content overflows viewport
            const vw = window.innerWidth, vh = window.innerHeight;
            const cw = b.scrollWidth, ch = b.scrollHeight;
            if (ch > vh + 2 || cw > vw + 2) {
                const scale = Math.min(vw / cw, vh / ch, 1);
                b.style.transform = `scale(${scale})`;
                b.style.transformOrigin = 'top left';
                b.style.width = (100 / scale) + 'vw';
            }
        }
        window.addEventListener('load', () => setTimeout(fitDisplay, 500));
        window.addEventListener('resize', fitDisplay);
    </script>
</body>
